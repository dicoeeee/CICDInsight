<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1040" viewBox="0 0 2200 1040">
  <defs>
    <linearGradient id="evidenceBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="0.54" stop-color="#F8F9FC"/>
      <stop offset="1" stop-color="#FFF7F2"/>
    </linearGradient>
    <style>
      .sans { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Menlo, monospace; }
      .navy { fill: #19324C; }
      .body { fill: #34495F; }
      .muted { fill: #74849A; }
      .cli { fill: #4967E8; }
      .mcp { fill: #EF7043; }
    </style>
  </defs>

  <rect width="2200" height="1040" fill="#FFFFFF"/>

  <!-- Detailed comparison -->
  <rect x="36" y="24" width="2128" height="532" rx="18" fill="#FFFFFF" stroke="#C8D2DF" stroke-width="2"/>

  <!-- Header -->
  <path d="M54 24h2110v96H36V42a18 18 0 0 1 18-18z" fill="#E9EDF2"/>
  <line x1="260" y1="24" x2="260" y2="556" stroke="#C8D2DF" stroke-width="2"/>
  <line x1="1212" y1="24" x2="1212" y2="556" stroke="#C8D2DF" stroke-width="2"/>
  <rect x="260" y="24" width="8" height="96" fill="#4967E8"/>
  <rect x="2156" y="24" width="8" height="96" fill="#EF7043"/>

  <text x="148" y="83" class="sans muted" font-size="27" font-weight="700" text-anchor="middle">对比维度</text>

  <rect x="302" y="45" width="54" height="54" rx="14" fill="#EDF1FF"/>
  <text x="329" y="82" class="mono cli" font-size="24" font-weight="800" text-anchor="middle">&gt;_</text>
  <text x="380" y="78" class="sans navy" font-size="34" font-weight="750">CLI</text>
  <text x="452" y="78" class="sans muted" font-size="23">直接执行面</text>
  <rect x="1010" y="47" width="160" height="44" rx="22" fill="#EDF1FF"/>
  <text x="1090" y="77" class="sans cli" font-size="21" font-weight="700" text-anchor="middle">Local / Runner</text>

  <rect x="1252" y="45" width="54" height="54" rx="14" fill="#FFF0E9"/>
  <path d="M1266 62h12l7 10-7 10h-12l-7-10z M1281 62h12l7 10-7 10h-12l-7-10z" fill="none" stroke="#EF7043" stroke-width="3" stroke-linejoin="round"/>
  <text x="1330" y="78" class="sans navy" font-size="34" font-weight="750">MCP</text>
  <text x="1423" y="78" class="sans muted" font-size="23">标准接入面</text>
  <rect x="1951" y="47" width="171" height="44" rx="22" fill="#FFF0E9"/>
  <text x="2036" y="77" class="sans mcp" font-size="21" font-weight="700" text-anchor="middle">Local / Remote</text>

  <!-- Row backgrounds -->
  <rect x="36" y="120" width="2128" height="106" fill="#FFFFFF"/>
  <rect x="36" y="226" width="2128" height="106" fill="#F8FAFC"/>
  <rect x="36" y="332" width="2128" height="106" fill="#FFFFFF"/>
  <path d="M36 438h2128v100a18 18 0 0 1-18 18H54a18 18 0 0 1-18-18z" fill="#F8FAFC"/>
  <line x1="36" y1="120" x2="2164" y2="120" stroke="#C8D2DF" stroke-width="2"/>
  <line x1="36" y1="226" x2="2164" y2="226" stroke="#D4DCE6" stroke-width="1.5"/>
  <line x1="36" y1="332" x2="2164" y2="332" stroke="#D4DCE6" stroke-width="1.5"/>
  <line x1="36" y1="438" x2="2164" y2="438" stroke="#D4DCE6" stroke-width="1.5"/>

  <!-- Row labels -->
  <circle cx="80" cy="173" r="8" fill="#19324C"/>
  <text x="108" y="182" class="sans navy" font-size="27" font-weight="750">定位</text>
  <circle cx="80" cy="279" r="8" fill="#19324C"/>
  <text x="108" y="288" class="sans navy" font-size="27" font-weight="750">核心优势</text>
  <circle cx="80" cy="385" r="8" fill="#19324C"/>
  <text x="108" y="394" class="sans navy" font-size="27" font-weight="750">主要代价</text>
  <circle cx="80" cy="491" r="8" fill="#19324C"/>
  <text x="108" y="500" class="sans navy" font-size="27" font-weight="750">适用场景</text>

  <!-- CLI cells -->
  <text x="302" y="164" class="sans navy" font-size="25" font-weight="700">复用成熟工具的完整执行语义</text>
  <text x="302" y="198" class="sans body" font-size="22.5">命令、文件、进程、管道与退出码直接参与 Agent 工作循环</text>

  <text x="302" y="270" class="sans navy" font-size="25" font-weight="700">能力保真、易重放，Shell 组合成本低</text>
  <text x="302" y="304" class="sans body" font-size="22.5">可复用现有脚本、Runner、权限与运维经验</text>

  <text x="302" y="376" class="sans navy" font-size="25" font-weight="700">接口与版本差异由 Agent / Skill 消化</text>
  <text x="302" y="410" class="sans body" font-size="22.5">输出、错误和帮助信息不稳定时，自动化可靠性下降</text>

  <text x="302" y="482" class="sans navy" font-size="25" font-weight="700">本地工程动作、CI Runner、已有成熟 CLI</text>
  <text x="302" y="516" class="sans body" font-size="22.5">强调执行语义、诊断复现与快速脚本化的任务</text>

  <!-- MCP cells -->
  <text x="1254" y="164" class="sans navy" font-size="25" font-weight="700">用协议统一能力发现与调用契约</text>
  <text x="1254" y="198" class="sans body" font-size="22.5">Host 通过 Tools、Resources、Prompts 接入本地或远程服务</text>

  <text x="1254" y="270" class="sans navy" font-size="25" font-weight="700">跨客户端互操作，支持远程鉴权与集中治理</text>
  <text x="1254" y="304" class="sans body" font-size="22.5">能力描述、OAuth 边界与企业管控更易标准化</text>

  <text x="1254" y="376" class="sans navy" font-size="25" font-weight="700">增加 Server、协议生命周期与权限治理成本</text>
  <text x="1254" y="410" class="sans body" font-size="22.5">若全量注入工具定义，还会放大上下文占用</text>

  <text x="1254" y="482" class="sans navy" font-size="25" font-weight="700">远程系统、多客户端共享、企业身份治理</text>
  <text x="1254" y="516" class="sans body" font-size="22.5">协议收益能够覆盖新增接入和运维复杂度的任务</text>

  <!-- Three concise trend statements -->
  <rect x="36" y="582" width="2128" height="432" rx="18" fill="url(#evidenceBg)" stroke="#D0D9E5" stroke-width="2"/>

  <rect x="68" y="614" width="2064" height="104" rx="16" fill="#FFFFFF" stroke="#BFCBF2" stroke-width="2"/>
  <rect x="68" y="614" width="10" height="104" rx="5" fill="#4967E8"/>
  <rect x="100" y="643" width="152" height="46" rx="23" fill="#EDF1FF"/>
  <text x="176" y="674" class="sans cli" font-size="22" font-weight="750" text-anchor="middle">CLI 趋势</text>
  <text x="286" y="675" class="sans navy" font-size="25" font-weight="650">Agent CLI 正从交互命令走向 Headless、结构化输出与 Skill，成为可重放的高保真执行面。</text>
  <text x="2098" y="674" class="sans muted" font-size="19.5" font-weight="600" text-anchor="end">Codex · Claude Code · Copilot CLI</text>

  <rect x="68" y="746" width="2064" height="104" rx="16" fill="#FFFFFF" stroke="#E3C9BE" stroke-width="2"/>
  <rect x="68" y="746" width="10" height="104" rx="5" fill="#EF7043"/>
  <rect x="100" y="775" width="152" height="46" rx="23" fill="#FFF0E9"/>
  <text x="176" y="806" class="sans mcp" font-size="22" font-weight="750" text-anchor="middle">MCP 趋势</text>
  <text x="286" y="807" class="sans navy" font-size="25" font-weight="650">MCP 正通过 Tool Search、渐进发现与程序化调用，从全量注入走向按需加载，并强化远程鉴权与治理。</text>
  <text x="2098" y="806" class="sans muted" font-size="19.5" font-weight="600" text-anchor="end">Claude Code · MCP Best Practices</text>

  <rect x="68" y="878" width="2064" height="104" rx="16" fill="#FFFFFF" stroke="#C9D2DD" stroke-width="2"/>
  <rect x="68" y="878" width="10" height="104" rx="5" fill="#19324C"/>
  <rect x="100" y="907" width="152" height="46" rx="23" fill="#19324C"/>
  <text x="176" y="938" class="sans" fill="#FFFFFF" font-size="22" font-weight="750" text-anchor="middle">整体趋势</text>
  <text x="286" y="939" class="sans navy" font-size="25" font-weight="650">主流终端 Agent 同时保留 CLI 与 MCP；界面选择趋向按任务组合，而非默认封装所有能力。</text>
  <text x="2098" y="938" class="sans muted" font-size="19.5" font-weight="600" text-anchor="end">Thoughtworks · “MCP by default” Caution</text>
</svg>
