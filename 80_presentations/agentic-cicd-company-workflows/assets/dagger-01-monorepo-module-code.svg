<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <rect width="1200" height="340" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1160" height="300" rx="22" fill="#171717"/>
  <circle cx="55" cy="53" r="7" fill="#E2383F"/>
  <circle cx="78" cy="53" r="7" fill="#555555"/>
  <circle cx="101" cy="53" r="7" fill="#777777"/>
  <text x="1138" y="59" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#A3A3A3">DAGGER MODULE · MONOREPO CI EXAMPLE</text>
  <line x1="44" y1="78" x2="1156" y2="78" stroke="#333333" stroke-width="2"/>

  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" xml:space="preserve">
    <text x="62" y="96" fill="#E2383F">@object()</text>
    <text x="62" y="115"><tspan fill="#E2383F">export class</tspan><tspan fill="#F5F5F5"> MonorepoCI {</tspan></text>
    <text x="62" y="134" fill="#E2383F">  @func()</text>
    <text x="62" y="153" fill="#F5F5F5">  <tspan fill="#E2383F">async</tspan> ci(repo: <tspan fill="#D4D4D4">Directory</tspan>): Promise&lt;void&gt; {</text>
    <text x="62" y="172" fill="#F5F5F5">    const <tspan fill="#E2383F">moduleA</tspan> = repo.directory("moduleA")</text>
    <text x="62" y="191" fill="#F5F5F5">    const <tspan fill="#E2383F">moduleB</tspan> = repo.directory("moduleB")</text>
    <text x="62" y="210" fill="#F5F5F5">    await <tspan fill="#E2383F" font-weight="700">Promise.all</tspan>([</text>
    <text x="62" y="229" fill="#D4D4D4">      this.test(this.build(<tspan fill="#E2383F">moduleA</tspan>)).sync(),</text>
    <text x="62" y="248" fill="#D4D4D4">      this.test(this.build(<tspan fill="#E2383F">moduleB</tspan>)).sync(),</text>
    <text x="62" y="267" fill="#F5F5F5">    ])</text>
    <text x="62" y="286" fill="#F5F5F5">  }</text>
    <text x="62" y="305" fill="#F5F5F5">}</text>
  </g>
</svg>
